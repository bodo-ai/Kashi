repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: pixi run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(python|scripts)/

      - id: ruff-format
        name: Ruff format
        entry: pixi run ruff format
        language: system
        types_or: [python, pyi]
        files: ^(python|scripts)/

      - id: clang-format
        name: Clang format
        entry: pixi run clang-format -i
        language: system
        files: ^cpp/.*\.(cpp|cc|cxx|h|hh|hpp|hxx)$
