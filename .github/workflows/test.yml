name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            architecture: x86_64
          - name: macOS Apple silicon
            runner: macos-15
            architecture: arm64
          - name: macOS Intel
            runner: macos-15-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - uses: prefix-dev/setup-pixi@v0.11.3
        id: pixi
        with:
          pixi-version: v0.80.0
          run-install: false
      - name: Install locked environment
        run: pixi install --locked
      - name: Python tests
        if: runner.os != 'Linux'
        run: pixi run --locked test-python
      - name: Python tests with coverage
        if: runner.os == 'Linux'
        run: pixi run --locked coverage-python
      - name: Native tests
        if: runner.os != 'Linux'
        run: pixi run --locked test-cpp
      - name: Native tests with coverage
        if: runner.os == 'Linux'
        run: pixi run --locked -e cpp-coverage coverage-cpp
      - name: Build wheel
        run: pixi run --locked python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
      - name: Install wheel and import outside checkout
        run: |
          pixi run --locked python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-check"
          cd "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-env/bin/python" -I - <<'PY'
          import pathlib
          import sys
          import kashi
          import kashi._native

          environment = pathlib.Path(sys.prefix).resolve()
          for module in (kashi, kashi._native):
              path = pathlib.Path(module.__file__).resolve()
              print(f"{module.__name__}: {path}")
              if not path.is_relative_to(environment):
                  raise RuntimeError(f"{module.__name__} was not imported from the wheel environment")
          PY
      - name: Summarize coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.pixi.outcome == 'success' }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path('build/coverage')
          print('## Python coverage\n')
          xml = reports / 'python.xml'
          if not xml.is_file():
              print('No Python coverage report was generated.')
          elif ElementTree.parse(xml).getroot().get('lines-valid') == '0':
              print('No executable Python statements to measure.')
          else:
              print((reports / 'python.md').read_text())

          print('\n## C++ coverage\n')
          native = reports / 'cpp.txt'
          if native.is_file():
              print('```text\n' + native.read_text() + '```')
          else:
              print('No C++ coverage report was generated.')
          PY
      - name: Upload coverage reports
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.pixi.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/coverage/python.xml
            build/coverage/cpp.txt
            build/coverage/cpp.json
          if-no-files-found: warn
