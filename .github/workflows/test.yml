name: Tests

on:
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  SCCACHE_GHA_ENABLED: "true"

jobs:
  lint:
    name: Formatting and linting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - &sccache
        uses: actions/github-script@v7
        with:
          script: |
            // Expose the cache endpoint and job-scoped token to Pixi's sccache.
            // GitHub provides them to this action, not to the later shell steps.
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              core.exportVariable(name, process.env[name] || '');
            }
      - &mold
        name: Enable mold on Linux
        if: runner.os == 'Linux'
        run: echo 'CMAKE_LINKER_TYPE=MOLD' >> "$GITHUB_ENV"
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.0
          locked: true
          cache-key: pixi-lint-${{ hashFiles('cmake/iree-sdk.json') }}-
      - name: Check Python and C++
        run: pixi run --locked lint

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            architecture: x86_64
          - name: macOS Apple silicon
            runner: macos-26
            architecture: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          # The event base can be older than the tested merge's first parent.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - *sccache
      - *mold
      - uses: prefix-dev/setup-pixi@v0.11.3
        if: runner.os == 'Linux'
        id: pixi
        with:
          pixi-version: v0.82.0
          locked: true
          environments: default cpp-coverage
          cache-key: pixi-test-${{ hashFiles('cmake/iree-sdk.json') }}-
      - uses: prefix-dev/setup-pixi@v0.11.3
        if: runner.os == 'macOS'
        with:
          pixi-version: v0.82.0
          run-install: false
      - name: Install macOS dependencies and editable package
        if: runner.os == 'macOS'
        # Pixi resolves against the locked macOS 14 target. Pip uses the
        # runner's actual platform when installing our macOS 26 editable wheel.
        run: |
          pixi install --locked --skip kashi
          MACOSX_DEPLOYMENT_TARGET=26.0 CMAKE_ARGS=-DCMAKE_OSX_DEPLOYMENT_TARGET=26.0 \
            pixi run --locked --no-install python -m pip install --no-deps -e .
      - name: Python tests
        if: runner.os != 'Linux'
        run: pixi run --locked --no-install test-python
      - name: Python tests with coverage
        if: runner.os == 'Linux'
        env:
          # vLLM's Triton CPU sampler can SIGILL on Zen2 GitHub runners.
          # Interpret Triton while retaining the real vLLM parity tests.
          TRITON_INTERPRET: "1"
        # Show where an unusually slow test is blocked without aborting it.
        run: pixi run --locked coverage-python -o faulthandler_timeout=600
      - name: Reclaim editable build space before native coverage
        if: runner.os == 'Linux'
        # Python coverage is complete; native coverage builds its own test binary.
        run: rm -rf build/scikit
      - name: Native tests
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: '26.0'
        run: pixi run --locked --no-install test-cpp
      - name: Native tests with coverage
        if: runner.os == 'Linux'
        run: pixi run --locked --no-install -e cpp-coverage coverage-cpp
      - name: Require more than 90% changed-line coverage
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_diff_coverage.py --exclude-gpu "$DIFF_BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summarize coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.pixi.outcome == 'success' }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path('build/coverage')
          print('## Python coverage\n')
          xml = reports / 'python.xml'
          if not xml.is_file():
              print('No Python coverage report was generated.')
          elif ElementTree.parse(xml).getroot().get('lines-valid') == '0':
              print('No executable Python statements to measure.')
          else:
              print((reports / 'python.md').read_text())

          print('\n## C++ coverage\n')
          native = reports / 'cpp.txt'
          if native.is_file():
              print('```text\n' + native.read_text() + '```')
          else:
              print('No C++ coverage report was generated.')
          PY
      - name: Upload coverage reports
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.pixi.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/coverage/python.xml
            build/coverage/cpp.txt
            build/coverage/cpp.json
            build/coverage/cpp.lcov
          if-no-files-found: warn
