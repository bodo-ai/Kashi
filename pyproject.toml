[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ml-compiler"
version = "0.1.0"
description = "Python and MLIR compiler development skeleton"
readme = "README.md"
requires-python = ">=3.10"

[tool.scikit-build]
wheel.packages = ["python/src/ml_compiler"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.14.*"
cxx-compiler = "*"
cmake = ">=3.20"
ninja = "*"
python-build = "*"
pip = "*"

[tool.pixi.pypi-dependencies]
ml-compiler = { path = ".", editable = true }
