[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "kashi"
version = "0.1.0"
description = "Python and MLIR compiler development skeleton"
readme = "README.md"
requires-python = ">=3.10"

[tool.scikit-build]
wheel.packages = ["python/src/kashi"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
  "integration: runs a real vLLM engine end to end (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pixi.workspace]
channels = ["conda-forge"]
requires-pixi = ">=0.82.0"
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = { driver = "13.0", arch = "7.5" }, glibc = "2.39" },
  { name = "linux-64-rocm", platform = "linux-64", amdgpu = true, glibc = "2.39" },
  { name = "linux-64-cpu", platform = "linux-64", glibc = "2.39" },
  { name = "osx-arm64-cpu", platform = "osx-arm64", macos = "14.0" },
]

[tool.pixi.dependencies]
python = "3.12.*"
setuptools = "==78.1.1"
cxx-compiler = "*"
cmake = ">=3.20"
ninja = "*"
python-build = "*"
pip = "*"
pytest = "*"
pytest-cov = ">=7.1"
catch2 = ">=3,<4"
nanobind = ">=2"
ruff = "*"
clang-tools = "21.*"
clangxx = "21.*"
pre-commit = ">=4.7.0,<5"

[tool.pixi.pypi-dependencies]
kashi = { path = ".", editable = true }
iree-base-compiler = "==3.14.0"
iree-base-runtime = "==3.14.0"
tabulate = "*"

[tool.pixi.tasks]
test-python = "python -m pytest"
coverage-python = "python -m pytest --cov=kashi --cov-branch --cov-report=term-missing --cov-report=xml:build/coverage/python.xml --cov-report=markdown:build/coverage/python.md"
test-cpp = "python scripts/test_cpp.py"
test-mutation = "python scripts/test_mutation.py"
format-python = "ruff format python scripts"
check-format-python = "ruff format --check python scripts"
lint-python = "ruff check python scripts"
format-cpp = '''bash -c 'find cpp -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.h" -o -name "*.hh" -o -name "*.hpp" -o -name "*.hxx" \) -exec clang-format -i {} +' '''
check-format-cpp = '''bash -c 'find cpp -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.h" -o -name "*.hh" -o -name "*.hpp" -o -name "*.hxx" \) -exec clang-format --dry-run --Werror {} +' '''
lint-cpp = '''
bash -c 'set -e
nanobind_dir=$(python -m nanobind --cmake_dir)
cmake -S . -B build/lint-cpp -G Ninja \
    -DCMAKE_CXX_COMPILER=clang++ -DKASHI_BUILD_TESTS=ON -DKASHI_LINT=ON \
    -DPython_EXECUTABLE="$CONDA_PREFIX/bin/python" \
    -Dnanobind_DIR="$nanobind_dir" -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
cmake --build build/lint-cpp --clean-first'
'''
lint = { depends-on = ["check-format-python", "lint-python", "check-format-cpp", "lint-cpp"] }

[tool.coverage.run]
data_file = "build/coverage/.coverage"

[tool.pixi.feature.cpp-coverage]
platforms = ["linux-64-cpu"]

[tool.pixi.feature.cpp-coverage.dependencies]
compiler-rt = "21.*"
llvm-tools = "21.*"

[tool.pixi.feature.cpp-coverage.tasks]
coverage-cpp = "python scripts/test_cpp.py --coverage"

[tool.pixi.pypi-options]
extra-index-urls = ["https://wheels.vllm.ai/rocm/0.33.0/rocm100"]


[tool.pixi.target.osx-arm64-cpu.pypi-dependencies]
torch = { version = "==2.14.0", index = "https://pypi.org/simple" }
torchvision = { version = "==0.29.2", index = "https://pypi.org/simple" }
torchaudio = { version = "==2.11.1", index = "https://pypi.org/simple" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.33.0rc3/vllm-0.33.0%2Bcpu-cp38-abi3-macosx_11_0_arm64.whl" }

[tool.pixi.target.linux-64-cpu.activation.env]
TRITON_DEFAULT_BACKEND = "cpu"

[tool.pixi.target.linux-64-cpu.pypi-dependencies]
torch = { version = "==2.14.0+cpu", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.29.2+cpu", index = "https://download.pytorch.org/whl/cpu" }
torchaudio = { version = "==2.11.1+cpu", index = "https://download.pytorch.org/whl/cpu" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.33.0rc3/vllm-0.33.0%2Bcpu-cp38-abi3-manylinux_2_39_x86_64.whl" }

[tool.pixi.target.linux-64-cuda.pypi-dependencies]
torch = { version = "==2.14.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.29.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "==2.11.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
triton = { version = "==3.8.0", index = "https://pypi.org/simple" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.33.0rc3/vllm-0.33.0-cp38-abi3-manylinux_2_28_x86_64.whl" }

[tool.pixi.target.linux-64-rocm.pypi-dependencies]
torch = { version = "==2.13.0+rocm10.0.0", index = "https://wheels.vllm.ai/rocm/0.33.0/rocm100" }
torchvision = { version = "==0.28.0+rocm10.0.0", index = "https://wheels.vllm.ai/rocm/0.33.0/rocm100" }
torchaudio = { version = "==2.11.0+rocm10.0.0", index = "https://wheels.vllm.ai/rocm/0.33.0/rocm100" }
triton = { version = "==3.8.0+git669b31ac", index = "https://wheels.vllm.ai/rocm/0.33.0/rocm100" }
vllm = { version = "==0.33.0+rocm100", index = "https://wheels.vllm.ai/rocm/0.33.0/rocm100" }

[tool.pixi.environments]
cpp-coverage = ["cpp-coverage"]
